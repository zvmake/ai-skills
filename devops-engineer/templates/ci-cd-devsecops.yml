# =============================================================================
# ЭТАЛОННЫЙ CI/CD ПАЙПЛАЙН С SHIFT-LEFT DEVSECOPS И БЕЗОПАСНЫМ ДЕПЛОЕМ
# Охватывает:
# 1. Secret Scanning (Gitleaks по всей истории)
# 2. SAST & Lint (Semgrep / golangci-lint / hadolint)
# 3. Multi-stage Build с BuildKit Secret Mount и иммутабельным тегом Git SHA
# 4. Container Image & SCA Scan (Trivy с блокировкой CRITICAL/HIGH) + SBOM
# 5. Авторизация в облаке/кластере строго через OIDC (без статических ключей!)
# 6. Pre-flight проверка, контролируемый Rollout и автоматический Rollback
# =============================================================================
name: Production CI/CD & DevSecOps Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Минимальные привилегии токена по умолчанию + OIDC
permissions:
  contents: read
  id-token: write
  security-events: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  K8S_NAMESPACE: payments-prod
  K8S_DEPLOYMENT: payment-service
  K8S_CONTAINER: payment-service

jobs:
  # ---------------------------------------------------------------------------
  # STAGE 1: SHIFT-LEFT SECURITY (SECRETS, SAST, LINT, UNIT TESTS)
  # ---------------------------------------------------------------------------
  security-and-test:
    name: Shift-Left Security & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history for secret scanning
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan Git history for leaked secrets (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run SAST static analysis (Semgrep)
        run: |
          docker run --rm -v "${GITHUB_WORKSPACE}:/src" \
            semgrep/semgrep:1.96.0 \
            semgrep scan --config p/default --error /src

      - name: Lint Dockerfile (Hadolint)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning

      - name: Setup Go & Run Unit Tests with Race Detector
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Run Tests
        run: go test -v -race -coverprofile=coverage.out ./...

  # ---------------------------------------------------------------------------
  # STAGE 2: IMMUTABLE BUILD, TRIVY IMAGE SCAN & SBOM
  # ---------------------------------------------------------------------------
  build-and-scan-image:
    name: Build, Scan & Push Immutable Image
    needs: security-and-test
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.sha_tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set immutable SHA tag
        id: meta
        run: echo "sha_tag=${REGISTRY}/${IMAGE_NAME}:sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build local image for vulnerability scanning (with BuildKit secret)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ steps.meta.outputs.sha_tag }}
          build-args: |
            VERSION=${{ github.sha }}
          secrets: |
            github_token=${{ secrets.PRIV_MODULES_GITHUB_TOKEN }}
          cache-from: type=gha
          # Запись в кэш только из защищённой ветки (защита от Cache Poisoning из PR)
          cache-to: ${{ github.event_name != 'pull_request' && 'type=gha,mode=max' || '' }}

      - name: Scan container image for CRITICAL/HIGH CVEs (Trivy Gate)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ steps.meta.outputs.sha_tag }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Generate SPDX SBOM from verified image (Trivy SBOM)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ steps.meta.outputs.sha_tag }}
          format: spdx-json
          output: sbom-spdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-spdx-${{ github.sha }}
          path: sbom-spdx.json
          retention-days: 30

      - name: Login to Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Пушим ИМЕННО ТОТ локальный образ, который прошёл проверку Trivy (Build Once!)
      - name: Push verified immutable image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker push "${{ steps.meta.outputs.sha_tag }}"

  # ---------------------------------------------------------------------------
  # STAGE 3: SAFE PRODUCTION ROLLOUT (OIDC AUTH + PRE/POST VERIFY + ROLLBACK)
  # ---------------------------------------------------------------------------
  deploy-production:
    name: Production Safe Rollout
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-and-scan-image
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Checkout code (for migration & verification scripts)
        uses: actions/checkout@v4

      # Аутентификация строго через краткоживущий OIDC токен (без статических ключей!)
      - name: Authenticate to Cloud Provider via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.CLOUD_OIDC_ROLE_ARN }}
          aws-region: ${{ vars.CLOUD_REGION }}

      - name: Configure Kubernetes Context
        run: aws eks update-kubeconfig --name "${{ vars.K8S_CLUSTER_NAME }}" --region "${{ vars.CLOUD_REGION }}"

      - name: Pre-flight Cluster & PDB Health Verification
        run: |
          kubectl -n "${K8S_NAMESPACE}" get deployment "${K8S_DEPLOYMENT}"
          kubectl -n "${K8S_NAMESPACE}" get pdb

      - name: Execute Rollout & Verify Readiness (Auto-Rollback on Failure)
        run: |
          set -Eeuo pipefail
          IMAGE_URI="${{ needs.build-and-scan-image.outputs.image_tag }}"
          echo "Deploying immutable image: ${IMAGE_URI}"

          kubectl -n "${K8S_NAMESPACE}" set image "deployment/${K8S_DEPLOYMENT}" \
            "${K8S_CONTAINER}=${IMAGE_URI}"

          if ! kubectl -n "${K8S_NAMESPACE}" rollout status "deployment/${K8S_DEPLOYMENT}" --timeout=180s; then
            echo "::error::Rollout failed readiness checks! Executing immediate rollback..."
            kubectl -n "${K8S_NAMESPACE}" rollout undo "deployment/${K8S_DEPLOYMENT}"
            kubectl -n "${K8S_NAMESPACE}" rollout status "deployment/${K8S_DEPLOYMENT}" --timeout=120s
            exit 1
          fi
