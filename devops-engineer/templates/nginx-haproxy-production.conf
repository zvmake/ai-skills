# =============================================================================
# 1. ЭТАЛОННАЯ КОНФИГУРАЦИЯ NGINX (REVERSE PROXY & L7 LOAD BALANCER)
# Ключевые механизмы:
# - Постоянный пул соединений к апстримам (keepalive) против исчерпания портов
# - Защита от медленных клиентов и жесткие таймауты переключения реплик
# - Структурированный JSON access_log с временем ответа апстрима ($upstream_response_time)
# - TLS 1.2/1.3 Hardening + Rate Limiting
# =============================================================================

user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 16384;
    use epoll;
    multi_accept on;
}

http {
    server_tokens off;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    # Структурированный JSON-лог для Vector / FluentBit / Loki / OpenSearch
    log_format json_combined escape=json
      '{'
        '"time_local":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"request_id":"$request_id",'
        '"request_method":"$request_method",'
        '"request_uri":"$request_uri",'
        '"status":$status,'
        '"request_time":$request_time,'
        '"upstream_addr":"$upstream_addr",'
        '"upstream_status":"$upstream_status",'
        '"upstream_connect_time":"$upstream_connect_time",'
        '"upstream_response_time":"$upstream_response_time"'
      '}';

    access_log /var/log/nginx/access.log json_combined buffer=32k flush=5s;
    error_log  /var/log/nginx/error.log warn;

    # Защита от всплесков (Rate Limiting)
    limit_req_zone $binary_remote_addr zone=api_limit:20m rate=100r/s;

    upstream backend_service {
        least_conn;
        server 10.0.10.11:8080 max_fails=3 fail_timeout=10s;
        server 10.0.10.12:8080 max_fails=3 fail_timeout=10s;

        # КРИТИЧНО: Пул keepalive-соединений к бэкендам (предотвращает шторм SYN_SENT и TIME_WAIT)
        keepalive 256;
        keepalive_requests 10000;
        keepalive_timeout 60s;
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name api.example.internal;

        ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_session_cache   shared:SSL:50m;
        ssl_session_timeout 1d;

        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Request-ID $request_id always;

        location / {
            limit_req zone=api_limit burst=200 nodelay;

            proxy_pass http://backend_service;
            # Обязательные директивы для работы upstream keepalive:
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;

            # Жесткие таймауты и безопасное переключение на живую реплику
            proxy_connect_timeout 3s;
            proxy_send_timeout    15s;
            proxy_read_timeout    30s;
            proxy_next_upstream   error timeout http_502 http_503;
            proxy_next_upstream_tries 2;
        }
    }
}

# =============================================================================
# 2. ЭТАЛОННАЯ КОНФИГУРАЦИЯ HAPROXY (/etc/haproxy/haproxy.cfg)
# Включает: сокет управления, Prometheus exporter, http-reuse, очереди и проверки
# =============================================================================
# global
#     maxconn 100000
#     log stdout format raw local0 info
#     stats socket /run/haproxy/admin.sock mode 660 level admin expose-fd listeners
#
# defaults
#     mode http
#     log global
#     option httplog
#     option dontlognull
#     option redispatch
#     http-reuse safe
#     timeout connect 3s
#     timeout client  30s
#     timeout server  30s
#     timeout http-keep-alive 15s
#     timeout queue   5s
#     retries 2
#
# frontend fe_http_in
#     bind :8080
#     # Встроенный эндпоинт метрик для Prometheus
#     http-request use-service prometheus-exporter if { path /metrics }
#     default_backend be_app_nodes
#
# backend be_app_nodes
#     balance leastconn
#     option httpchk
#     http-check send meth GET uri /healthz/ready ver HTTP/1.1 hdr Host internal
#     http-check expect status 200
#     default-server inter 3s fall 3 rise 2 maxconn 2000
#     server app01 10.0.10.11:8080 check
#     server app02 10.0.10.12:8080 check
