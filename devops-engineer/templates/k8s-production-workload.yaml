# =============================================================================
# ЭТАЛОННЫЙ КОМПЛЕКТ МАНИФЕСТОВ KUBERNETES ДЛЯ PRODUCTION
# Включает:
# 1. Deployment (Zero-Downtime RollingUpdate, Anti-Affinity по зонам и нодам,
#    Restricted Pod Security Standard, Read-Only RootFS, 3 типа проб, preStop)
# 2. PodDisruptionBudget (защита от одновременного выселения всех реплик)
# 3. HorizontalPodAutoscaler v2 (контролируемое масштабирование)
# 4. Service (ClusterIP)
# 5. NetworkPolicy (Default Deny + белый список разрешённых связей и DNS)
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  namespace: payments-prod
  labels:
    app.kubernetes.io/name: payment-service
    app.kubernetes.io/part-of: payments-platform
spec:
  replicas: 6
  revisionHistoryLimit: 10
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: payment-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: payment-service
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 35
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: payment-service
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: payment-service
      containers:
        - name: payment-service
          # Только иммутабельный тег (версия + SHA), никогда не :latest
          image: ghcr.io/org/payment-service:sha-a1b2c3d4e5f6
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "1500m"
              memory: "512Mi" # Guaranteed Memory (requests == limits) против OOM eviction
          # 1. Startup probe — дает приложению до 30с на инициализацию
          startupProbe:
            httpGet:
              path: /healthz/startup
              port: http
            periodSeconds: 2
            failureThreshold: 15
          # 2. Readiness probe — управляет подачей трафика в Endpoints
          readinessProbe:
            httpGet:
              path: /healthz/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          # 3. Liveness probe — проверяет только отсутствие локального deadlock!
          livenessProbe:
            httpGet:
              path: /healthz/live
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          # Пауза перед закрытием слушающего сокета для завершения обновления Endpoints
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]
          volumeMounts:
            - name: tmp-dir
              mountPath: /tmp
      volumes:
        - name: tmp-dir
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: payment-service-pdb
  namespace: payments-prod
spec:
  minAvailable: 80%
  selector:
    matchLabels:
      app.kubernetes.io/name: payment-service
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: payment-service-hpa
  namespace: payments-prod
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: payment-service
  minReplicas: 6
  maxReplicas: 24
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: v1
kind: Service
metadata:
  name: payment-service
  namespace: payments-prod
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: payment-service
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: payment-service-zero-trust
  namespace: payments-prod
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: payment-service
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8080
  egress:
    # Разрешаем DNS-запросы к CoreDNS
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Разрешаем подключение к пулеру БД (PgBouncer / Yugabyte)
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: db-pooler
      ports:
        - protocol: TCP
          port: 5432
